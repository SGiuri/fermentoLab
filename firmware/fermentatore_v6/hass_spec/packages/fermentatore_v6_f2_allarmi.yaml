# =============================================================================
# Pacchetto Home Assistant — Fermentatore V6 F2 — ALLARMI
# Compatibile con firmware 6.1.x e 6.2.x: usa solo entità già esistenti
# (sensor.f2_v6_temperatura, sensor.f2_v6_setpoint, sensor.f2_v6_fsm) e il topic esp/state.
#
# - Temperatura fuori range: scostamento oltre soglia per N minuti e non in avvicinamento.
#   Copre i guasti che il firmware non vede: pompa, glicole, fascia, relè.
# - Dati fermi: nessun messaggio su esp/state da 5 minuti (indipendente dal LWT).
# - In modalità Didattica (pacchetto _laboratorio) lo scostamento dà solo la notifica in HA, senza email.
#
# Installazione: copiare in /config/packages/ e in configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
#
# FILE GENERATO da genera_f2.py a partire da fermentatore_v6_f2_allarmi.yaml: non modificare a mano.
# =============================================================================

input_number:
  f2_v6_soglia_scostamento:
    name: "F2 V6 Soglia Scostamento"
    min: 0.5
    max: 5
    step: 0.1
    initial: 1.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
  f2_v6_minuti_scostamento:
    name: "F2 V6 Minuti Scostamento"
    min: 10
    max: 480
    step: 10
    initial: 60
    unit_of_measurement: "min"
    icon: mdi:timer-alert

template:
  - sensor:
      - name: "F2 V6 Scostamento Assoluto"
        unique_id: f2_v6_scostamento_assoluto
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >-
          {{ has_value('sensor.f2_v6_temperatura') and has_value('sensor.f2_v6_setpoint') }}
        state: >-
          {{ ((states('sensor.f2_v6_temperatura') | float) - (states('sensor.f2_v6_setpoint') | float)) | abs | round(2) }}

  # Istantanea ogni 30 minuti: lo stato è il valore della istantanea precedente, l'attributo
  # "ultimo" quello appena preso. Un sensore di tendenza si aggiornerebbe solo ai cambi di
  # temperatura e resterebbe sconosciuto proprio con temperatura ferma.
  - triggers:
      - trigger: time_pattern
        minutes: "/30"
    sensor:
      - name: "F2 V6 Scostamento Precedente"
        unique_id: f2_v6_scostamento_precedente
        unit_of_measurement: "°C"
        state: "{{ this.attributes.get('ultimo') }}"
        attributes:
          ultimo: "{{ states('sensor.f2_v6_scostamento_assoluto') | float(none) }}"

  # "on" finché arrivano messaggi su esp/state (heartbeat 30-60 s), "off" dopo 5 minuti di silenzio.
  - triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f2/esp/state"
    binary_sensor:
      - name: "F2 V6 Dati In Arrivo"
        unique_id: f2_v6_dati_in_arrivo
        device_class: connectivity
        state: "on"
        auto_off:
          minutes: 5

  - binary_sensor:
      - name: "F2 V6 In Avvicinamento"
        unique_id: f2_v6_in_avvicinamento
        # Senza istantanea precedente si considera in avvicinamento: meglio un allarme
        # in ritardo dopo un riavvio di HA che un falso allarme durante un cold crash.
        state: >-
          {% set ora = states('sensor.f2_v6_scostamento_assoluto') | float(none) %}
          {% set prima = states('sensor.f2_v6_scostamento_precedente') | float(none) %}
          {{ ora is none or prima is none or ora < prima - 0.1 }}

      - name: "F2 V6 Allarme Temperatura"
        unique_id: f2_v6_allarme_temperatura
        device_class: problem
        availability: "{{ has_value('sensor.f2_v6_scostamento_assoluto') }}"
        state: >-
          {{ states('sensor.f2_v6_fsm') in ['RUNNING', 'HOLDING']
             and (states('sensor.f2_v6_scostamento_assoluto') | float(0))
                 > (states('input_number.f2_v6_soglia_scostamento') | float(1.5))
             and is_state('binary_sensor.f2_v6_in_avvicinamento', 'off') }}

automation:
  - id: v6_f2_pkg_fuori_temperatura
    alias: "F2 V6 - Temperatura fuori range"
    description: >-
      Scostamento oltre soglia per il tempo impostato e temperatura che non si avvicina al setpoint.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_allarme_temperatura
        to: "on"
        for:
          minutes: "{{ states('input_number.f2_v6_minuti_scostamento') | int(60) }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: f2_v6_pkg_fuori_temperatura
          title: "F2 V6: temperatura fuori range"
          message: >-
            Temperatura {{ states('sensor.f2_v6_temperatura') }} °C, setpoint {{ states('sensor.f2_v6_setpoint') }} °C
            (scostamento {{ states('sensor.f2_v6_scostamento_assoluto') }} °C), non in avvicinamento da oltre
            {{ states('input_number.f2_v6_minuti_scostamento') | int(60) }} minuti.
            Riscaldatore {{ states('binary_sensor.f2_v6_riscaldatore') }}, refrigeratore {{ states('binary_sensor.f2_v6_refrigeratore') }}.
            {% if is_state('input_select.f2_v6_modalita', 'Didattica') %}Modalità Didattica: email non inviata.{% endif %}
      # In Didattica lo scostamento è spesso voluto (esperimenti, taratura): niente email.
      # Gli allarmi tecnici (offline, sensore, dati fermi, riavvii) restano sempre attivi.
      - if:
          - condition: template
            value_template: "{{ not is_state('input_select.f2_v6_modalita', 'Didattica') }}"
        then:
          - action: notify.fermentazione_email
            data:
              title: "[ALLARME] F2 V6 - Temperatura fuori range"
              message: >-
                {{ now().strftime('%Y-%m-%d %H:%M') }} - Temperatura {{ states('sensor.f2_v6_temperatura') }} °C,
                setpoint {{ states('sensor.f2_v6_setpoint') }} °C, scostamento {{ states('sensor.f2_v6_scostamento_assoluto') }} °C
                da oltre {{ states('input_number.f2_v6_minuti_scostamento') | int(60) }} minuti, senza avvicinamento.
                Riscaldatore {{ states('binary_sensor.f2_v6_riscaldatore') }}, refrigeratore {{ states('binary_sensor.f2_v6_refrigeratore') }}.
                Profilo {{ states('sensor.f2_v6_profilo') }}, step {{ states('sensor.f2_v6_step') }}.
                Verificare fascia, pompa, livello e temperatura del glicole.

  - id: v6_f2_pkg_temperatura_rientrata
    alias: "F2 V6 - Temperatura rientrata"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_allarme_temperatura
        from: "on"
        to: "off"
        for:
          minutes: 10
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: f2_v6_pkg_fuori_temperatura

  - id: v6_f2_pkg_dati_fermi
    alias: "F2 V6 - Nessun dato dall'ESP32"
    description: "Nessun messaggio su esp/state da 6 minuti con un profilo attivo."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_dati_in_arrivo
        to: "off"
        for:
          minutes: 1
    conditions:
      - condition: template
        value_template: >-
          {{ states('input_text.f2_v6_profilo_attivo') not in ['Nessuno', '', 'unknown', 'unavailable'] }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: f2_v6_pkg_dati_fermi
          title: "F2 V6: nessun dato dall'ESP32"
          message: >-
            Nessun messaggio di stato da 6 minuti. Il firmware continua a regolare in autonomia,
            ma i valori mostrati da Home Assistant non sono aggiornati.
      - action: notify.fermentazione_email
        data:
          title: "[ALLARME] F2 V6 - Nessun dato dall'ESP32"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} - Nessun messaggio su esp/state da 6 minuti.
            Profilo attivo: {{ states('input_text.f2_v6_profilo_attivo') }}.
            Ultima temperatura ricevuta: {{ states('sensor.f2_v6_temperatura') }} °C.
            Verificare alimentazione, WiFi e broker.

  - id: v6_f2_pkg_dati_ripresi
    alias: "F2 V6 - Dati di nuovo in arrivo"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_dati_in_arrivo
        from: "off"
        to: "on"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: f2_v6_pkg_dati_fermi

# =============================================================================
# Pacchetto Home Assistant — Fermentatore V6 F1 — ENTITÀ  (richiede firmware >= 6.2.0; stima >= 6.5.0)
#
# Ridefinisce le entità MQTT con disponibilità (LWT retained su esp/availability) e scadenza
# dei valori, aggiunge i sensori diagnostici e gli allarmi offline, sensore guasto e riavvio
# anomalo. Da installare insieme al flash del 6.2.0: con il 6.1.x le entità risultano non
# disponibili perché il topic esp/availability non esiste.
# Gli allarmi di temperatura sono in fermentatore_v6_f1_allarmi.yaml (vale per entrambi).
#
# Installazione
#   1. Copiare in /config/packages/ (packages abilitati come per il file allarmi).
#   2. Rimuovere dalla configurazione esistente le entità MQTT con questi unique_id
#      (HA rifiuta gli unique_id duplicati). Gli entity_id e lo storico restano:
#        f1_v6_temp_reale f1_v6_setpoint f1_v6_pid_output f1_v6_duty_risc
#        f1_v6_duty_frigo f1_v6_ore_step f1_v6_ore_totali f1_v6_step_nome
#        f1_v6_step_index f1_v6_profilo f1_v6_stato_fsm f1_v6_modo_controllo_attivo
#        f1_v6_firmware ferm_v6_f1_hardware_target ferm_v6_f1_allarme_tipo
#        f1_v6_ack ferm_v6_f1_esp_log f1_v6_riscaldatore f1_v6_refrigeratore
#        f1_v6_allarme f1_v6_online
#   3. Rimuovere l'automazione "F1 V6 - ESP32 Offline (LWT)" (id v6_f1_esp32_offline_lwt):
#      dal firmware 6.2.0 il LWT non è più su esp/alarm e non scatterebbe mai.
#   4. Riavviare Home Assistant.
#
# Generato da genera_f2.py: modificare questo file e rigenerare la versione F2.
# =============================================================================

mqtt:
  sensor:
    # --- Misure: scadono se l'ESP smette di pubblicare (heartbeat 30 s) ---
    - name: "F1 V6 Temperatura"
      unique_id: f1_v6_temp_reale
      icon: mdi:thermometer
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      # Con sensore non utilizzabile il valore diventa sconosciuto invece dell'ultima lettura
      value_template: >-
        {{ value_json.temp_reale if value_json.get('sensore_ok', true) and value_json.temp_reale is not none else none }}
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      suggested_display_precision: 2

    - name: "F1 V6 Setpoint"
      unique_id: f1_v6_setpoint
      icon: mdi:target
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.setpoint }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      suggested_display_precision: 2

    - name: "F1 V6 PID Output"
      unique_id: f1_v6_pid_output
      icon: mdi:chart-bell-curve-cumulative
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.pid_output }}"
      unit_of_measurement: "%"
      state_class: measurement

    - name: "F1 V6 Duty Riscaldatore"
      unique_id: f1_v6_duty_risc
      icon: mdi:fire
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.duty_riscaldatore }}"
      unit_of_measurement: "%"
      state_class: measurement

    - name: "F1 V6 Duty Refrigeratore"
      unique_id: f1_v6_duty_frigo
      icon: mdi:snowflake
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.duty_refrigeratore }}"
      unit_of_measurement: "%"
      state_class: measurement

    - name: "F1 V6 Ore Step"
      unique_id: f1_v6_ore_step
      icon: mdi:clock-outline
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.ore_step }}"
      unit_of_measurement: "h"

    - name: "F1 V6 Ore Totali"
      unique_id: f1_v6_ore_totali
      icon: mdi:clock-check-outline
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.ore_totali }}"
      unit_of_measurement: "h"

    - name: "F1 V6 Step"
      unique_id: f1_v6_step_nome
      icon: mdi:stairs
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ value_json.step_nome }}"

    - name: "F1 V6 Step Index"
      unique_id: f1_v6_step_index
      icon: mdi:counter
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ value_json.step_index }}"

    - name: "F1 V6 Profilo"
      unique_id: f1_v6_profilo
      icon: mdi:flask
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ value_json.profilo }}"

    - name: "F1 V6 FSM"
      unique_id: f1_v6_stato_fsm
      icon: mdi:state-machine
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.stato_fsm }}"

    - name: "F1 V6 Modo Controllo Attivo"
      unique_id: f1_v6_modo_controllo_attivo
      icon: mdi:tune
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ value_json.control_mode }}"

    - name: "F1 V6 Firmware"
      unique_id: f1_v6_firmware
      icon: mdi:chip
      state_topic: "fermentazione/v6/f1/esp/state"
      value_template: "{{ value_json.firmware }}"
      entity_category: diagnostic

    - name: "F1 V6 Hardware Target"
      unique_id: ferm_v6_f1_hardware_target
      icon: mdi:chip-outline
      state_topic: "fermentazione/v6/f1/esp/state"
      value_template: "{{ value_json.hardware_target }}"
      entity_category: diagnostic

    # --- Diagnostica (nuovi campi firmware 6.2.0) ---
    - name: "F1 V6 Eta Lettura"
      unique_id: f1_v6_temp_eta_s
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.temp_eta_s if value_json.get('temp_eta_s', -1) >= 0 else none }}"
      unit_of_measurement: "s"
      device_class: duration
      state_class: measurement
      entity_category: diagnostic

    - name: "F1 V6 Uptime"
      unique_id: f1_v6_uptime
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('uptime_s') }}"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      entity_category: diagnostic

    - name: "F1 V6 Causa Ultimo Reset"
      unique_id: f1_v6_reset_reason
      state_topic: "fermentazione/v6/f1/esp/state"
      value_template: "{{ value_json.get('reset_reason') }}"
      entity_category: diagnostic

    - name: "F1 V6 RSSI"
      unique_id: f1_v6_rssi
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('rssi') }}"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      entity_category: diagnostic

    - name: "F1 V6 Commutazioni Rele"
      unique_id: f1_v6_commutazioni
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ value_json.get('commutazioni') }}"
      state_class: total_increasing
      entity_category: diagnostic

    # --- Diagnostica del sensore DS18B20 (esp/state.sensore_diag, firmware >= 6.4.1) ---
    # Contatori dal boot (a ogni riavvio ripartono da zero: total_increasing lo gestisce). Le letture
    # scartate non arrivano mai a HA; questi contatori sono l'unico modo di vederle. Base del test
    # di collaudo 'salute_sensore'. Con firmware < 6.4.1 restano sconosciuti.
    - name: "F1 V6 Sensore Letture"
      unique_id: f1_v6_sensore_letture
      icon: mdi:counter
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('letture') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Non Valide"
      unique_id: f1_v6_sensore_non_valide
      icon: mdi:thermometer-alert
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('non_valide') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Scollegato"
      unique_id: f1_v6_sensore_scollegato
      icon: mdi:thermometer-off
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('scollegato') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Poweron 85"
      unique_id: f1_v6_sensore_poweron_85
      icon: mdi:thermometer-alert
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('poweron_85') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Fuori Scala"
      unique_id: f1_v6_sensore_fuori_scala
      icon: mdi:thermometer-alert
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('fuori_scala') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Picco"
      unique_id: f1_v6_sensore_picco
      icon: mdi:chart-bell-curve
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('picco') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Vicino Rele"
      unique_id: f1_v6_sensore_vicino_rele
      icon: mdi:electric-switch
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('vicino_rele') }}"
      state_class: total_increasing
      entity_category: diagnostic
    - name: "F1 V6 Sensore Power Cycle"
      unique_id: f1_v6_sensore_power_cycle
      icon: mdi:power-cycle
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('sensore_diag') or {}).get('power_cycle') }}"
      state_class: total_increasing
      entity_category: diagnostic

    # --- Regolazione stimata con sensore perso (esp/state.stima, firmware >= 6.5.0) ---
    # Il firmware impara il carico termico (duty dei relè, temperatura media e pendenza) nelle ultime
    # 2-4 h di controllo normale; se il DS18B20 si perde pilota i relè con quel carico, corretto per il
    # setpoint corrente. "Duty" = quello che applica (o applicherebbe) adesso. Con firmware < 6.5.0
    # restano sconosciuti.
    - name: "F1 V6 Stima Duty Freddo"
      unique_id: f1_v6_stima_duty_freddo
      icon: mdi:snowflake-thermometer
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ (value_json.get('stima') or {}).get('freddo') }}"
      unit_of_measurement: "%"
      state_class: measurement
    - name: "F1 V6 Stima Duty Caldo"
      unique_id: f1_v6_stima_duty_caldo
      icon: mdi:radiator
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ (value_json.get('stima') or {}).get('caldo') }}"
      unit_of_measurement: "%"
      state_class: measurement
    - name: "F1 V6 Stima Ore"
      unique_id: f1_v6_stima_ore
      icon: mdi:timer-sand
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ (value_json.get('stima') or {}).get('ore') }}"
      unit_of_measurement: "h"
      state_class: measurement
    - name: "F1 V6 Stima Carico Appreso"
      unique_id: f1_v6_stima_carico_appreso
      icon: mdi:chart-timeline-variant
      state_topic: "fermentazione/v6/f1/esp/state"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ (value_json.get('stima') or {}).get('u_freddo') }}"
      json_attributes_topic: "fermentazione/v6/f1/esp/state"
      json_attributes_template: "{{ (value_json.get('stima') or {}) | tojson }}"
      unit_of_measurement: "%"
      entity_category: diagnostic

    # --- Diagnostica dei reset e del loop (esp/diag, firmware >= 6.4.2) ---
    # Topic retained, ripubblicato a ogni heartbeat. I valori "reset" descrivono il reset che ha preceduto
    # l'ULTIMO avvio e cambiano solo a un nuovo riavvio; "loop" riguarda il boot corrente. Come leggerli:
    # docs/06_COLLAUDO_F1.md §7. Con firmware < 6.4.2 restano sconosciuti.
    - name: "F1 V6 Reset Hardware"
      unique_id: f1_v6_diag_reset_hw
      icon: mdi:restart-alert
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('reset') or {}).get('hw_nome') }}"
      json_attributes_topic: "fermentazione/v6/f1/esp/diag"
      json_attributes_template: "{{ (value_json.get('reset') or {}) | tojson }}"
      entity_category: diagnostic

    - name: "F1 V6 Reset Ultimo Giro"
      unique_id: f1_v6_diag_reset_giro_ms
      icon: mdi:timer-sand
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: >-
        {% set g = (value_json.get('reset') or {}).get('giro_ms') %}
        {{ g if g is number and g >= 0 else none }}
      unit_of_measurement: "ms"
      entity_category: diagnostic

    - name: "F1 V6 Reset Ultima Commutazione"
      unique_id: f1_v6_diag_reset_comm_ms
      icon: mdi:electric-switch
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: >-
        {% set g = (value_json.get('reset') or {}).get('comm_ms') %}
        {{ g if g is number and g >= 0 else none }}
      unit_of_measurement: "ms"
      entity_category: diagnostic

    - name: "F1 V6 Loop Massimo"
      unique_id: f1_v6_diag_loop_max_ms
      icon: mdi:speedometer-slow
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('loop') or {}).get('max_ms') }}"
      unit_of_measurement: "ms"
      state_class: measurement
      entity_category: diagnostic

    - name: "F1 V6 Loop Sezione Lenta"
      unique_id: f1_v6_diag_loop_max_sez
      icon: mdi:progress-clock
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('loop') or {}).get('max_sez') }}"
      entity_category: diagnostic

    - name: "F1 V6 Loop Giri Lenti"
      unique_id: f1_v6_diag_loop_lenti_1s
      icon: mdi:snail
      state_topic: "fermentazione/v6/f1/esp/diag"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      value_template: "{{ (value_json.get('loop') or {}).get('lenti_1s') }}"
      state_class: total_increasing
      entity_category: diagnostic

    # --- Eventi (senza scadenza: restano visibili anche con ESP offline) ---
    - name: "F1 V6 Allarme Tipo"
      unique_id: ferm_v6_f1_allarme_tipo
      icon: mdi:alert-circle-outline
      state_topic: "fermentazione/v6/f1/esp/alarm"
      value_template: "{{ value_json.tipo }}"

    - name: "F1 V6 Ack"
      unique_id: f1_v6_ack
      icon: mdi:check-circle-outline
      state_topic: "fermentazione/v6/f1/esp/ack"
      value_template: "{{ value_json.cmd }}: {{ value_json.status }}{{ ' (' ~ value_json.reason_code ~ ')' if value_json.reason_code else '' }}"
      json_attributes_topic: "fermentazione/v6/f1/esp/ack"

    - name: "F1 V6 ESP Log"
      unique_id: ferm_v6_f1_esp_log
      icon: mdi:console-line
      state_topic: "fermentazione/v6/f1/esp/log"
      value_template: "{{ value_json.liv }} {{ value_json.mod }}: {{ value_json.msg[:200] }}"
      entity_category: diagnostic

    # --- Didattica: grandezze interne del controllore (esp/controllo, firmware >= 6.3.0) ---
    - name: "F1 V6 Errore"
      unique_id: f1_v6_ctl_errore
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('errore') }}"
      unit_of_measurement: "°C"
      state_class: measurement
      suggested_display_precision: 2
      icon: mdi:delta
    - name: "F1 V6 Termine P"
      unique_id: f1_v6_ctl_p
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('p') }}"
      unit_of_measurement: "%"
      state_class: measurement
      suggested_display_precision: 1
      icon: mdi:alpha-p-box
    - name: "F1 V6 Termine I"
      unique_id: f1_v6_ctl_i
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('i') }}"
      unit_of_measurement: "%"
      state_class: measurement
      suggested_display_precision: 1
      icon: mdi:alpha-i-box
    - name: "F1 V6 Termine D"
      unique_id: f1_v6_ctl_d
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('d') }}"
      unit_of_measurement: "%"
      state_class: measurement
      suggested_display_precision: 2
      icon: mdi:alpha-d-box
    - name: "F1 V6 Uscita Controllore"
      unique_id: f1_v6_ctl_uscita
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('uscita') }}"
      unit_of_measurement: "%"
      state_class: measurement
      suggested_display_precision: 1
      icon: mdi:tune-vertical
    - name: "F1 V6 Integrale"
      unique_id: f1_v6_ctl_integrale
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('integrale') }}"
      unit_of_measurement: "°C·s"
      state_class: measurement
      suggested_display_precision: 0
      entity_category: diagnostic
    - name: "F1 V6 Isteresi Attiva"
      unique_id: f1_v6_ctl_isteresi
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('isteresi') }}"
      unit_of_measurement: "°C"
      state_class: measurement
      suggested_display_precision: 2
      icon: mdi:arrow-expand-vertical
    - name: "F1 V6 KP Caldo Attivo"
      unique_id: f1_v6_ctl_kp_caldo
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('kp_caldo') }}"
      entity_category: diagnostic
    - name: "F1 V6 KI Caldo Attivo"
      unique_id: f1_v6_ctl_ki_caldo
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('ki_caldo') }}"
      entity_category: diagnostic
    - name: "F1 V6 KD Caldo Attivo"
      unique_id: f1_v6_ctl_kd_caldo
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120
      value_template: "{{ value_json.get('kd_caldo') }}"
      entity_category: diagnostic
    - name: "F1 V6 KP Freddo Attivo"
      unique_id: f1_v6_ctl_kp_freddo
      state_topic: "fermentazione/v6/f1/esp/controllo"
      availability_topic: "fermentazione/v6/f1/esp/availability"
      expire_after: 120

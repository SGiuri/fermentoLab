      expire_after: 120
      value_template: "{{ 'ON' if (value_json.get('stima') or {}).get('pronta') else 'OFF' }}"
      entity_category: diagnostic

template:
  # Riavvii non comandati: uptime che torna indietro con meno di 90 s tra l'ultimo messaggio e il boot
  # e causa diversa da 'software' (reboot da HA, OTA, recupero del sensore). Un blackout vero dura di più.
  - triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f1/esp/state"
    sensor:
      - name: "F1 V6 Riavvii Spontanei"
        unique_id: f1_v6_riavvii_spontanei
        icon: mdi:restart-alert
        state_class: total_increasing
        state: >-
          {% set n = this.state | int(0) %}
          {% set u = trigger.payload_json.get('uptime_s', -1) | int(-1) %}
          {% set pu = this.attributes.get('uptime_prec', -1) | int(-1) %}
          {% set pt = this.attributes.get('msg_prec_ts', 0) | float(0) %}
          {% set boot = now().timestamp() - u %}
          {% set spontaneo = u >= 0 and pu >= 0 and u < pu and pt > 0 and (boot - pt) < 90
                             and trigger.payload_json.get('reset_reason') != 'software' %}
          {{ n + (1 if spontaneo else 0) }}
        attributes:
          uptime_prec: "{{ trigger.payload_json.get('uptime_s', -1) }}"
          msg_prec_ts: "{{ now().timestamp() | round(0) }}"
          ultimo: >-
            {% set u = trigger.payload_json.get('uptime_s', -1) | int(-1) %}
            {% set pu = this.attributes.get('uptime_prec', -1) | int(-1) %}
            {% set pt = this.attributes.get('msg_prec_ts', 0) | float(0) %}
            {% set boot = now().timestamp() - u %}
            {% if u >= 0 and pu >= 0 and u < pu and pt > 0 and (boot - pt) < 90
                  and trigger.payload_json.get('reset_reason') != 'software' %}
            {{ {'quando': boot | round(0), 'causa': trigger.payload_json.get('reset_reason'),
                'offline_s': [(boot - pt) | round(0), 0] | max} }}
            {% else %}{{ this.attributes.get('ultimo') }}{% endif %}


automation:
  - id: v6_f1_pkg_offline
    alias: "F1 V6 - ESP32 offline (availability)"
    description: "LWT retained su esp/availability: scatta anche se HA si riavvia dopo la caduta."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f1_v6_online
        to: "off"
        for:
          minutes: 3
    actions:
      - action: persistent_notification.create
        data:
          notification_id: f1_v6_pkg_offline
          title: "F1 V6: ESP32 offline"
          message: >-
            Nessuna connessione MQTT da 3 minuti. Il firmware continua a regolare la temperatura
            in autonomia, ma non è più monitorato. Ultima temperatura nota nello storico.
      - action: notify.fermentazione_email
        data:
          title: "[ALLARME] F1 V6 - ESP32 offline"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — ESP32 F1 offline da 3 minuti.
            Profilo: {{ states('sensor.f1_v6_profilo') }}. Step: {{ states('sensor.f1_v6_step') }}.
            Verificare alimentazione e WiFi.

  - id: v6_f1_pkg_online
    alias: "F1 V6 - ESP32 di nuovo online"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f1_v6_online
        from: "off"
        to: "on"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: f1_v6_pkg_offline
      - delay:
          seconds: 45
      - action: persistent_notification.create
        data:
          notification_id: f1_v6_pkg_online
          title: "F1 V6: ESP32 di nuovo online"
          message: >-
            Stato {{ states('sensor.f1_v6_fsm') }}, temperatura {{ states('sensor.f1_v6_temperatura') }} °C,
            setpoint {{ states('sensor.f1_v6_setpoint') }} °C, causa ultimo reset
            {{ states('sensor.f1_v6_causa_ultimo_reset') }}.

  - id: v6_f1_pkg_sensore_guasto
    alias: "F1 V6 - Sensore temperatura non utilizzabile"
    description: "Il firmware ha spento i relè per sicurezza: la temperatura non è regolata."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f1_v6_sensore_guasto
        to: "on"
        for:
          minutes: 2
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ALLARME] F1 V6 - Sensore DS18B20 non utilizzabile"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — Nessuna lettura valida del DS18B20 da oltre 2 minuti.
            {% if is_state('binary_sensor.f1_v6_regolazione_stimata', 'on') %}
            I relè NON sono spenti: il firmware regola alla cieca col carico appreso (freddo
            {{ states('sensor.f1_v6_stima_duty_freddo') }} %, caldo {{ states('sensor.f1_v6_stima_duty_caldo') }} %)
            e la curva prosegue (setpoint {{ states('sensor.f1_v6_setpoint') }} °C). Durata massima 72 h.
            {% else %}
            I relè sono spenti per sicurezza: la birra NON è regolata finché il sensore non torna valido
            (stima del carico non disponibile: servono 2 h di controllo normale, o firmware < 6.5.0).
            {% endif %}
            {% if has_value('sensor.f1_temperatura_stimata_ispindel') %}Temperatura stimata dall'iSpindel:
            {{ states('sensor.f1_temperatura_stimata_ispindel') }} °C.{% else %}iSpindel non disponibile: nessun controllo indipendente.{% endif %}
            Ultima lettura valida {{ states('sensor.f1_v6_eta_lettura') }} s fa.

  - id: v6_f1_pkg_regolazione_stimata
    alias: "F1 V6 - Regolazione stimata (sensore perso)"
    description: >-
      Eventi del firmware >= 6.5.0 su esp/alarm: inizio e fine della regolazione alla cieca, stima non
      disponibile (relè spenti), durata massima superata (relè spenti).
    mode: queued
    triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f1/esp/alarm"
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.get('tipo') in ['regolazione_stimata', 'fine_regolazione_stimata',
             'regolazione_stimata_non_disponibile', 'regolazione_stimata_scaduta'] }}
    actions:
      - variables:
          tipo: "{{ trigger.payload_json.tipo }}"
          titoli:
            regolazione_stimata: "[ALLARME] F1 V6 - Sensore perso: regolazione stimata attiva"
            fine_regolazione_stimata: "[INFO] F1 V6 - Sensore tornato: fine regolazione stimata"
            regolazione_stimata_non_disponibile: "[ALLARME] F1 V6 - Sensore perso senza stima: relè spenti"
            regolazione_stimata_scaduta: "[ALLARME] F1 V6 - Regolazione stimata oltre 72 h: relè spenti"
      - action: notify.fermentazione_email
        data:
          title: "{{ titoli[tipo] }}"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} —
            {% if tipo == 'regolazione_stimata' %}
            Il DS18B20 non risponde: il firmware pilota i relè con il carico appreso nelle ultime ore
            (freddo {{ states('sensor.f1_v6_stima_duty_freddo') }} %, caldo {{ states('sensor.f1_v6_stima_duty_caldo') }} %
            del tempo, su finestre di 40 minuti) e la curva prosegue (setpoint {{ states('sensor.f1_v6_setpoint') }} °C).
            È un controllo ad anello aperto: se la stanza o la fermentazione cambiano, la temperatura deriva.
            Sorveglianza: iSpindel {% if has_value('sensor.f1_temperatura_stimata_ispindel') %}attivo, temperatura stimata
            {{ states('sensor.f1_temperatura_stimata_ispindel') }} °C{% else %}NON disponibile{% endif %}.
            Correzione da remoto: se la birra risulta più calda di X °C, abbassare il setpoint di X °C (e viceversa):
            la stima ricalcola il duty per tenere la nuova temperatura.
            {% elif tipo == 'fine_regolazione_stimata' %}
            Il DS18B20 è tornato valido: controllo normale ripreso. Temperatura {{ states('sensor.f1_v6_temperatura') }} °C,
            setpoint {{ states('sensor.f1_v6_setpoint') }} °C.
            {% elif tipo == 'regolazione_stimata_non_disponibile' %}
            Il DS18B20 non risponde e il firmware non ha ancora una stima del carico (servono 2 h di controllo
            normale dopo l'avvio): i relè sono spenti e la birra non è regolata.
            {% else %}
            La regolazione alla cieca dura da 72 ore: i relè sono stati spenti. Intervento sul posto necessario.
            {% endif %}
            Profilo {{ states('sensor.f1_v6_profilo') }}, step {{ states('sensor.f1_v6_step') }}.

  - id: v6_f1_pkg_riavvio_spontaneo
    alias: "F1 V6 - Riavvio spontaneo ESP32"
    description: >-
      L'ESP32 è ripartito da solo (causa poweron) restando offline meno di 90 s: non è un blackout ma
      un disturbo di alimentazione o sul pin EN, tipicamente alla commutazione della pompa.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.f1_v6_riavvii_spontanei
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
      - condition: template
        value_template: "{{ (state_attr('sensor.f1_v6_riavvii_spontanei', 'ultimo') or {}).get('causa') == 'poweron' }}"
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ATTENZIONE] F1 V6 - Riavvio spontaneo dell'ESP32"
          message: >-
            {% set u = state_attr('sensor.f1_v6_riavvii_spontanei', 'ultimo') or {} %}
            {{ now().strftime('%Y-%m-%d %H:%M') }} — L'ESP32 F1 si è riavviato da solo (causa {{ u.get('causa') }},
            offline circa {{ u.get('offline_s') }} s). Riavvii spontanei registrati: {{ states('sensor.f1_v6_riavvii_spontanei') }}.
            Ha ripreso in stato {{ states('sensor.f1_v6_fsm') }} con setpoint {{ states('sensor.f1_v6_setpoint') }} °C.
            Probabile disturbo alla commutazione della pompa: verificare snubber sulla pompa, condensatore sul pin EN,
            alimentazione separata di ESP32 e relè.

  - id: v6_f1_pkg_riavvio_anomalo
    alias: "F1 V6 - Riavvio anomalo ESP32"
    description: "Watchdog, panic o brownout: il loop si è bloccato o l'alimentazione è instabile."
    mode: single
    triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f1/esp/state"
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.get('uptime_s', 999999) < 180
             and trigger.payload_json.get('reset_reason') in ['panic', 'task_wdt', 'int_wdt', 'wdt', 'brownout'] }}
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ATTENZIONE] F1 V6 - Riavvio anomalo ({{ trigger.payload_json.reset_reason }})"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — L'ESP32 F1 si è riavviato per {{ trigger.payload_json.reset_reason }}.
            Ha ripreso in stato {{ trigger.payload_json.stato_fsm }} con setpoint {{ trigger.payload_json.setpoint }} °C.
            Se si ripete, verificare alimentatore e cablaggio.
      # Un solo avviso per avvio (lo stato arriva ogni 30 s)
      - delay:
          minutes: 5

# =============================================================================
# Pacchetto Home Assistant — Fermentatore V6 F2 — ENTITÀ  (richiede firmware >= 6.2.0)
#
# Ridefinisce le entità MQTT con disponibilità (LWT retained su esp/availability) e scadenza
# dei valori, aggiunge i sensori diagnostici e gli allarmi offline, sensore guasto e riavvio
# anomalo. Da installare insieme al flash del 6.2.0: con il 6.1.x le entità risultano non
# disponibili perché il topic esp/availability non esiste.
# Gli allarmi di temperatura sono in fermentatore_v6_f2_allarmi.yaml (vale per entrambi).
#
# Installazione
#   1. Copiare in /config/packages/ (packages abilitati come per il file allarmi).
#   2. Rimuovere dalla configurazione esistente le entità MQTT con questi unique_id
#      (HA rifiuta gli unique_id duplicati). Gli entity_id e lo storico restano:
#        f2_v6_temp_reale f2_v6_setpoint f2_v6_pid_output f2_v6_duty_risc
#        f2_v6_duty_frigo f2_v6_ore_step f2_v6_ore_totali f2_v6_step_nome
#        f2_v6_step_index f2_v6_profilo f2_v6_stato_fsm f2_v6_modo_controllo_attivo
#        f2_v6_firmware ferm_v6_f2_hardware_target ferm_v6_f2_allarme_tipo
#        f2_v6_ack ferm_v6_f2_esp_log f2_v6_riscaldatore f2_v6_refrigeratore
#        f2_v6_allarme f2_v6_online
#   3. Rimuovere l'automazione "F2 V6 - ESP32 Offline (LWT)" (id v6_f2_esp32_offline_lwt):
#      dal firmware 6.2.0 il LWT non è più su esp/alarm e non scatterebbe mai.
#   4. Riavviare Home Assistant.
#
# FILE GENERATO da genera_f2.py a partire da fermentatore_v6_f2_entita.yaml: non modificare a mano.
# =============================================================================

mqtt:
  sensor:
    # --- Misure: scadono se l'ESP smette di pubblicare (heartbeat 30 s) ---
    - name: "F2 V6 Temperatura"
      unique_id: f2_v6_temp_reale
      icon: mdi:thermometer
      state_topic: "fermentazione/v6/f2/esp/state"
      availability_topic: "fermentazione/v6/f2/esp/availability"
      expire_after: 120
      # Con sensore non utilizzabile il valore diventa sconosciuto invece dell'ultima lettura
      value_template: >-
        {{ value_json.temp_reale if value_json.get('sensore_ok', true) and value_json.temp_reale is not none else none }}
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      suggested_display_precision: 2

    - name: "F2 V6 Setpoint"
      unique_id: f2_v6_setpoint
      icon: mdi:target
      state_topic: "fermentazione/v6/f2/esp/state"
      availability_topic: "fermentazione/v6/f2/esp/availability"
      expire_after: 120

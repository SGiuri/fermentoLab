template:
  # Riavvii non comandati: uptime che torna indietro con meno di 90 s tra l'ultimo messaggio e il boot
  # e causa diversa da 'software' (reboot da HA, OTA, recupero del sensore). Un blackout vero dura di più.
  - triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f2/esp/state"
    sensor:
      - name: "F2 V6 Riavvii Spontanei"
        unique_id: f2_v6_riavvii_spontanei
        icon: mdi:restart-alert
        state_class: total_increasing
        state: >-
          {% set n = this.state | int(0) %}
          {% set u = trigger.payload_json.get('uptime_s', -1) | int(-1) %}
          {% set pu = this.attributes.get('uptime_prec', -1) | int(-1) %}
          {% set pt = this.attributes.get('msg_prec_ts', 0) | float(0) %}
          {% set boot = now().timestamp() - u %}
          {% set spontaneo = u >= 0 and pu >= 0 and u < pu and pt > 0 and (boot - pt) < 90
                             and trigger.payload_json.get('reset_reason') != 'software' %}
          {{ n + (1 if spontaneo else 0) }}
        attributes:
          uptime_prec: "{{ trigger.payload_json.get('uptime_s', -1) }}"
          msg_prec_ts: "{{ now().timestamp() | round(0) }}"
          ultimo: >-
            {% set u = trigger.payload_json.get('uptime_s', -1) | int(-1) %}
            {% set pu = this.attributes.get('uptime_prec', -1) | int(-1) %}
            {% set pt = this.attributes.get('msg_prec_ts', 0) | float(0) %}
            {% set boot = now().timestamp() - u %}
            {% if u >= 0 and pu >= 0 and u < pu and pt > 0 and (boot - pt) < 90
                  and trigger.payload_json.get('reset_reason') != 'software' %}
            {{ {'quando': boot | round(0), 'causa': trigger.payload_json.get('reset_reason'),
                'offline_s': [(boot - pt) | round(0), 0] | max} }}
            {% else %}{{ this.attributes.get('ultimo') }}{% endif %}


automation:
  - id: v6_f2_pkg_offline
    alias: "F2 V6 - ESP32 offline (availability)"
    description: "LWT retained su esp/availability: scatta anche se HA si riavvia dopo la caduta."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_online
        to: "off"
        for:
          minutes: 3
    actions:
      - action: persistent_notification.create
        data:
          notification_id: f2_v6_pkg_offline
          title: "F2 V6: ESP32 offline"
          message: >-
            Nessuna connessione MQTT da 3 minuti. Il firmware continua a regolare la temperatura
            in autonomia, ma non è più monitorato. Ultima temperatura nota nello storico.
      - action: notify.fermentazione_email
        data:
          title: "[ALLARME] F2 V6 - ESP32 offline"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — ESP32 F2 offline da 3 minuti.
            Profilo: {{ states('sensor.f2_v6_profilo') }}. Step: {{ states('sensor.f2_v6_step') }}.
            Verificare alimentazione e WiFi.

  - id: v6_f2_pkg_online
    alias: "F2 V6 - ESP32 di nuovo online"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_online
        from: "off"
        to: "on"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: f2_v6_pkg_offline
      - delay:
          seconds: 45
      - action: persistent_notification.create
        data:
          notification_id: f2_v6_pkg_online
          title: "F2 V6: ESP32 di nuovo online"
          message: >-
            Stato {{ states('sensor.f2_v6_fsm') }}, temperatura {{ states('sensor.f2_v6_temperatura') }} °C,
            setpoint {{ states('sensor.f2_v6_setpoint') }} °C, causa ultimo reset
            {{ states('sensor.f2_v6_causa_ultimo_reset') }}.

  - id: v6_f2_pkg_sensore_guasto
    alias: "F2 V6 - Sensore temperatura non utilizzabile"
    description: "Il firmware ha spento i relè per sicurezza: la temperatura non è regolata."
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.f2_v6_sensore_guasto
        to: "on"
        for:
          minutes: 2
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ALLARME] F2 V6 - Sensore DS18B20 non utilizzabile"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — Nessuna lettura valida del DS18B20 da oltre 2 minuti.
            I relè sono spenti per sicurezza: la birra NON è regolata finché il sensore non torna valido.
            Ultima lettura valida {{ states('sensor.f2_v6_eta_lettura') }} s fa.

  - id: v6_f2_pkg_riavvio_spontaneo
    alias: "F2 V6 - Riavvio spontaneo ESP32"
    description: >-
      L'ESP32 è ripartito da solo (causa poweron) restando offline meno di 90 s: non è un blackout ma
      un disturbo di alimentazione o sul pin EN, tipicamente alla commutazione della pompa.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.f2_v6_riavvii_spontanei
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
      - condition: template
        value_template: "{{ (state_attr('sensor.f2_v6_riavvii_spontanei', 'ultimo') or {}).get('causa') == 'poweron' }}"
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ATTENZIONE] F2 V6 - Riavvio spontaneo dell'ESP32"
          message: >-
            {% set u = state_attr('sensor.f2_v6_riavvii_spontanei', 'ultimo') or {} %}
            {{ now().strftime('%Y-%m-%d %H:%M') }} — L'ESP32 F2 si è riavviato da solo (causa {{ u.get('causa') }},
            offline circa {{ u.get('offline_s') }} s). Riavvii spontanei registrati: {{ states('sensor.f2_v6_riavvii_spontanei') }}.
            Ha ripreso in stato {{ states('sensor.f2_v6_fsm') }} con setpoint {{ states('sensor.f2_v6_setpoint') }} °C.
            Probabile disturbo alla commutazione della pompa: verificare snubber sulla pompa, condensatore sul pin EN,
            alimentazione separata di ESP32 e relè.

  - id: v6_f2_pkg_riavvio_anomalo
    alias: "F2 V6 - Riavvio anomalo ESP32"
    description: "Watchdog, panic o brownout: il loop si è bloccato o l'alimentazione è instabile."
    mode: single
    triggers:
      - trigger: mqtt
        topic: "fermentazione/v6/f2/esp/state"
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.get('uptime_s', 999999) < 180
             and trigger.payload_json.get('reset_reason') in ['panic', 'task_wdt', 'int_wdt', 'wdt', 'brownout'] }}
    actions:
      - action: notify.fermentazione_email
        data:
          title: "[ATTENZIONE] F2 V6 - Riavvio anomalo ({{ trigger.payload_json.reset_reason }})"
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} — L'ESP32 F2 si è riavviato per {{ trigger.payload_json.reset_reason }}.
            Ha ripreso in stato {{ trigger.payload_json.stato_fsm }} con setpoint {{ trigger.payload_json.setpoint }} °C.
            Se si ripete, verificare alimentatore e cablaggio.
      # Un solo avviso per avvio (lo stato arriva ogni 30 s)
      - delay:
          minutes: 5

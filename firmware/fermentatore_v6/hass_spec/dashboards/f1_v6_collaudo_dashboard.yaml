                  'non applicabile': 'mdi:minus-circle-outline', 'non eseguito': 'mdi:circle-outline'}.get(e, 'mdi:circle-outline') }}
            icon_color: >-
              {% set e = states('sensor.f1_collaudo_comandi') %}
              {{ {'superato': 'green', 'avviso': 'amber', 'fallito': 'red', 'in corso': 'blue', 'in coda': 'light-blue',
                  'interrotto': 'grey', 'non applicabile': 'disabled'}.get(e, 'disabled') }}
            badge_icon: "{{ 'mdi:check-bold' if is_state('input_boolean.f1_collaudo_sel_comandi', 'on') else '' }}"
            badge_color: blue
            multiline_secondary: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
              entity: sensor.f1_collaudo_comandi

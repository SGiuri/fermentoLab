="pl" text-anchor="start" >IN1 (caldo)</text><text x="538" y="524" class="pl" text-anchor="start" >IN2 (freddo)</text><text x="538" y="584" class="pl" text-anchor="start" >VCC</text><text x="538" y="629" class="pl" text-anchor="start" >GND</text><line x1="410" y1="480" x2="530" y2="480" class="sig" /><line x1="410" y1="520" x2="530" y2="520" class="sig" /><line x1="508" y1="580" x2="530" y2="580" class="p5" /><line x1="508" y1="580" x2="508" y2="589" class="p5" /><line x1="501" y1="589" x2="515" y2="589" class="p5" /><text x="508" y="604" class="tb" text-anchor="middle" >+5 V</text><line x1="508" y1="625" x2="530" y2="625" class="gnd" /><line x1="508" y1="625" x2="508" y2="631" class="gnd" /><line x1="498" y1="631" x2="518" y2="631" class="gnd" /><line x1="502" y1="635" x2="514" y2="635" class="gnd" /><line x1="506" y1="639" x2="510" y2="639" class="gnd" /><text x="722" y="494" class="pl" text-anchor="end" >K1 COM</text><text x="722" y="524" class="pl" text-anchor="end" >K1 NO</text><text x="722" y="574" class="pl" text-anchor="end" >K2 COM</text><text x="722" y="604" class="pl" text-anchor="end" >K2 NO</text><line x1="730" y1="490" x2="790" y2="490" class="mains" /><rect x="790" y="484" width="40" height="12" class="comp rec"/><text x="810" y="478" class="t" text-anchor="middle" >FU1 T500 mA</text><line x1="830" y1="490" x2="990" y2="490" class="mains" /><circle cx="990" cy="490" r="3.5" class="dotm"/><text x="1002" y="494" class="tm" text-anchor="start" >L</text><line x1="730" y1="520" x2="790" y2="520" class="mains" /><rect x="790" y="514" width="150" height="12" class="comp"/><text x="865" y="545" class="t" text-anchor="middle" >Fascia riscaldante 30–35 W</text><line x1="940" y1="520" x2="990" y2="520" class="mains" /><circle cx="990" cy="520" r="3.5" class="dotm"/><text x="1002" y="524" class="tm" text-anchor="start" >N</text><line x1="730" y1="570" x2="790" y2="570" class="mains" /><rect x="790" y="564" width="40" height="12" class="comp rec"/><text x="810" y=
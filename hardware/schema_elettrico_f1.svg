tart" >massa comune (GND)</text><line x1="44" y1="844" x2="84" y2="844" class="mains"/><text x="94" y="848" class="t" text-anchor="start" >rete 230 V (pericolo)</text><rect x="44" y="854" width="40" height="10" class="comp rec"/><text x="94" y="863" class="t" text-anchor="start" >componente tratteggiato = raccomandato / da verificare su F1</text><text x="440" y="776" class="t" text-anchor="start" >Massa comune obbligatoria tra ESP32, relè, sonda e OLED.</text><text x="440" y="792" class="t" text-anchor="start" >Il pull-up 4,7 kΩ va su GPIO25 (VDD commutato) per</text><text x="440" y="808" class="t" text-anchor="start" >rendere efficace il power-cycle software del sensore.</text><text x="440" y="830" class="t" text-anchor="start" >Il chiller NON passa da questa scatola: presa separata,</text><text x="440" y="846" class="t" text-anchor="start" >termostato proprio, sempre acceso.</text><text x="440" y="868" class="t" text-anchor="start" >Contatti NO: a riposo (boot, reset, ESP scollegato) i carichi sono spenti.</text></svg>
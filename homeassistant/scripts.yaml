      temp_target: '{{ states(''input_number.f2_v6_temp_costante'') | float(20.0)
        }}'
      avvio_ts: '{{ as_timestamp(now()) | int }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not is_state(''input_select.f2_v6_stato_controllo'', ''idle'')
          }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: 'F2 V6: Avvio Bloccato'
          message: 'Impossibile avviare: una fermentazione è già in corso. Premi STOP
            per interrompere prima.

            '
          notification_id: f2_v6_avvio_bloccato
      - stop: Fermentazione già in corso
  - action: input_number.set_value
    target:
      entity_id: input_number.f2_v6_avvio_epoch
    data:
      value: '{{ avvio_ts }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.f2_v6_profilo_attivo
    data:
      value: Costante {{ temp_target | round(1) }}°C
  - action: input_select.select_option
    target:
      entity_id: input_select.f2_v6_stato_controllo
    data:
      option: in_corso
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f2/ha/cmd/control_set
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f2-cost-ctrl-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }},\n \"control_mode\":\"{{ 'on_off_hyst_sym'
        if states('input_select.f2_v6_modo_controllo') == 'on_off_isteresi' else states('input_select.f2_v6_modo_controllo')
        }}\",\n \"params\":{\n   \"kp_heat\":{{ states('input_number.f2_v6_kp_risc')
        | float(5.0) }},\n   \"ki_heat\":{{ states('input_number.f2_v6_ki_risc') |
        float(0.005) }},\n   \"kd_heat\":{{ states('input_number.f2_v6_kd_risc') |
        float(0.0) }},\n   \"kp_cool\":{{ states('input_number.f2_v6_kp_frigo') |
        float(1.0) }},\n   \"ki_cool\":{{ states('input_number.f2_v6_ki_frigo') |
        float(0.001) }},\n   \"kd_cool\":{{ states('input_number.f2_v6_kd_frigo')
        | float(0.0) }}\n }}"
      qos: 1
      retain: false
  - delay:
      milliseconds: 300
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f2/ha/cmd/profile_set
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f2-cost-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }},\n \"profilo\":\"Costante {{ temp_target
        | round(1) | string }}C\",\n \"avvio_epoch\":0,\n \"steps\":[{\"step\":\"Temperatura
        costante\",\"temp\":{{ temp_target | round(1) }},\"duration_hours\":2160}]}"
      qos: 1
      retain: false
  - action: persistent_notification.create
    data:
      title: 'F2 V6: Temperatura Costante Avviata'
      message: 'Controllo avviato a {{ temp_target | round(1) }}°C per 90 giorni.
        Algoritmo: {{ states(''input_select.f2_v6_modo_controllo'') }}.

        '
      notification_id: f2_v6_costante_avviata
  mode: single
v6_f1_safe_mode_change:
  alias: V6 F1 — Cambio mode sicuro
  description: 'Sequenza sicura stop→ack→control_set→ack→start. Usare questo script
    invece del select diretto per cambiare algoritmo di controllo mentre il fermentatore
    è in RUNNING.

    '
  icon: mdi:swap-horizontal-bold
  fields:
    control_mode:
      description: Algoritmo (on_off/on_off_hyst_sym/on_off_hyst_asym/P/PI/PD/PID)
      default: on_off_hyst_sym
      selector:
        select:
          options:
          - on_off
          - on_off_hyst_sym
          - on_off_hyst_asym
          - P
          - PI
          - PD
          - PID
    params:
      description: Oggetto parametri JSON (es. {kp_heat:5.0, ki_heat:0.005})
      default: {}
  sequence:
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f1/ha/cmd/stop
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f1-stop-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }},\"reason\":\"mode_change\"}"
      qos: 1
      retain: false
  - wait_for_trigger:
    - trigger: mqtt
      topic: fermentazione/v6/f1/esp/ack
      value_template: '{{ value_json.get(''cmd'') == ''stop'' }}'
    timeout: 00:00:10
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger is not none and wait.trigger.payload_json.status
      == ''ok'' }}'
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f1/ha/cmd/control_set
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f1-ctrl-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }},\"control_mode\":\"{{ control_mode
        }}\",\n \"params\":{{ params | tojson }}}"
      qos: 1
      retain: false
  - wait_for_trigger:
    - trigger: mqtt
      topic: fermentazione/v6/f1/esp/ack
      value_template: '{{ value_json.get(''cmd'') == ''control_set'' }}'
    timeout: 00:00:10
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger is not none and wait.trigger.payload_json.status
      == ''ok'' }}'
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f1/ha/cmd/start
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f1-start-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }}}"
      qos: 1
      retain: false
  mode: single

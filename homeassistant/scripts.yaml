test_email_alert:
  alias: Test Email Alert
  icon: mdi:email-arrow-right
  description: Invia un'email di test tramite il relay SMTP configurato. Crea una
    notifica persistente con il feedback dell'esito.
  sequence:
  - action: notify.fermentazione_email
    data:
      title: '[TEST] Home Assistant — Email Alert OK'
      message: 'Test email inviata da Home Assistant — {{ now().strftime(''%Y-%m-%d
        %H:%M:%S'') }}

        Relay: <smtp-server> (<smtp-server-ip>:25) Mittente: <sender@example.com>

        Se ricevi questo messaggio il sistema di alert è funzionante.

        '
  - action: persistent_notification.create
    data:
      title: Email di test inviata ✓
      message: 'Email inviata a <recipient@example.com> — {{ now().strftime(''%H:%M:%S'')
        }}. Verifica la casella di posta.

        '
      notification_id: test_email_alert_ok
  mode: single

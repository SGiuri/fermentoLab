        \  {\"step\":\"Cold crash\",\"temp\":3.0,\"duration_hours\":48}\n ]}"
      qos: 1
      retain: false
  - action: input_text.set_value
    target:
      entity_id: input_text.f2_v6_profilo_attivo
    data:
      value: '{{ states(''input_select.f2_v6_profilo_scelto'') | default(''Profilo'')
        }}'
  mode: single

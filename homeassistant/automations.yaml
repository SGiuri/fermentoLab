- id: v6_f2_mode_watchdog
  alias: V6 F2 — Watchdog control_mode
  description: 'Invia control_set se esp/state riporta un control_mode diverso da
    quello desiderato. Gestisce il fallback su on_off_hyst_sym dopo ogni reboot.

    '
  triggers:
  - trigger: mqtt
    topic: fermentazione/v6/f2/esp/state
  conditions:
  - condition: template
    value_template: "{% set reported  = trigger.payload_json.get('control_mode', '')
      %} {% set ha_mode   = states('input_select.f2_v6_modo_controllo') %} {% set
      desired   = 'on_off_hyst_sym' if ha_mode == 'on_off_isteresi' else ha_mode %}
      {{ trigger.payload_json.get('stato_fsm') == 'RUNNING'\n   and reported != desired\n
      \  and is_state('input_select.f2_v6_stato_controllo', 'in_corso') }}"
  actions:
  - action: mqtt.publish
    data:
      topic: fermentazione/v6/f2/ha/cmd/control_set
      payload: "{\"schema_version\":\"1.0\",\"request_id\":\"f2-wdg-{{ now().strftime('%H%M%S')
        }}\",\n \"ts\":{{ now()|as_timestamp|int }},\n \"control_mode\":\"{{ 'on_off_hyst_sym'
        if states('input_select.f2_v6_modo_controllo') == 'on_off_isteresi' else states('input_select.f2_v6_modo_controllo')
        }}\",\n \"params\":{\n   \"kp_heat\":{{ states('input_number.f2_v6_kp_risc')
        | float(5.0) }},\n   \"ki_heat\":{{ states('input_number.f2_v6_ki_risc') |
        float(0.005) }},\n   \"kd_heat\":{{ states('input_number.f2_v6_kd_risc') |
        float(0.0) }},\n   \"kp_cool\":{{ states('input_number.f2_v6_kp_frigo') |
        float(1.0) }},\n   \"ki_cool\":{{ states('input_number.f2_v6_ki_frigo') |
        float(0.001) }},\n   \"kd_cool\":{{ states('input_number.f2_v6_kd_frigo')
        | float(0.0) }}\n }}"
      qos: 1
      retain: false
  - action: system_log.write
    data:
      level: warning
      message: "V6 F2 watchdog: control_mode mismatch (ESP={{ trigger.payload_json.get('control_mode')
        }},\n desiderato={{ states('input_select.f2_v6_modo_controllo') }}).\nCorretto
        con control_set."
  mode: single
- id: v6_f2_reset_conferma_stop
  alias: F2 V6 - Auto-Reset Conferma Stop
  triggers:
  - trigger: state

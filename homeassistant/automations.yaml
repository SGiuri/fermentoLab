        Profilo attivo: {{ states(''input_text.f2_v6_profilo_attivo'') }} Ore trascorse:  {{
        states(''sensor.f2_v6_ore_totali'') }}h

        '
  mode: single
- id: v6_f2_esp32_offline_lwt

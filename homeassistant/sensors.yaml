# ══════════════════════════════════════════════════════════════════════════════
# SENSORS — Sensori derivati (statistics + history_stats)
# Finestra temporale fissa: ultime 24h
# ══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# V6 — STATISTICS (temperatura, delta, duty, PID)
# ─────────────────────────────────────────────────────────────────────────────
- platform: statistics
  entity_id: sensor.f1_v6_temperatura
  name: "F1 V6 Temp Stats 24h"
  unique_id: f1_v6_temp_stats_24h
  state_characteristic: mean
  sampling_size: 2880
  max_age:
    hours: 24

- platform: statistics
  entity_id: sensor.f1_v6_delta_temperatura
  name: "F1 V6 Delta Stats 24h"
  unique_id: f1_v6_delta_stats_24h
  state_characteristic: mean
  sampling_size: 2880
  max_age:
    hours: 24

- platform: statistics
  entity_id: sensor.f1_v6_duty_riscaldatore
  name: "F1 V6 Duty Risc Stats 24h"
